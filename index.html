<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8f1eb" />
    <meta name="description" content="คู่มือการจัดการข้อร้องเรียนแบบ Flipbook" />
    <title>คู่มือการจัดการข้อร้องเรียน</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23063b2c'/%3E%3Cpath d='M14 16c7-3 13-2 18 2v31c-5-4-11-5-18-2V16Zm36 0c-7-3-13-2-18 2v31c5-4 11-5 18-2V16Z' fill='%2379e6bd'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260918-2" />
  </head>
  <body>
    <main class="reader" aria-label="หนังสือออนไลน์">
      <div class="book-stage" id="book-stage">
        <div id="book" aria-label="คู่มือการจัดการข้อร้องเรียน 13 หน้า"></div>
        <div class="loading" id="loading" role="status">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span>กำลังเปิดหนังสือ…</span>
        </div>
      </div>

      <nav class="controls" id="controls" aria-label="ตัวควบคุมหนังสือ">
        <button class="nav-button" id="prev-button" type="button" aria-label="หน้าก่อนหน้า">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m15 18-6-6 6-6" />
          </svg>
          <span>ก่อนหน้า</span>
        </button>

        <button class="page-status" id="page-status" type="button" aria-label="ไปยังหน้า" aria-live="polite">
          <span class="page-label">หน้า</span>
          <span id="current-page">1</span>
          <span class="page-divider">/</span>
          <span id="total-pages">13</span>
        </button>

        <button class="nav-button" id="next-button" type="button" aria-label="หน้าถัดไป">
          <span>ถัดไป</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>

        <span class="control-divider" aria-hidden="true"></span>

        <button class="icon-button" id="fullscreen-button" type="button" aria-label="เปิดเต็มจอ">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
          </svg>
        </button>
      </nav>

      <p class="hint" id="hint">
        <span aria-hidden="true">↔</span>
        ปัดหรือลากมุมกระดาษเพื่อเปิดหน้า
      </p>
    </main>

    <dialog class="page-dialog" id="page-dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <strong>เลือกหน้า</strong>
            <small>แตะภาพเพื่อไปยังหน้าที่ต้องการ</small>
          </div>
          <button class="close-button" value="cancel" aria-label="ปิด" type="submit">×</button>
        </div>
        <div class="page-grid" id="page-grid"></div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="./app.js?v=20260918-3"></script>
  </body>
</html>
